name: BargeBoss
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    CLANG_ENABLE_OBJC_ARC: YES
    BARGEBOSS_IOS_PROFILE: 0
    GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'BB_IOS_PROFILE=$(BARGEBOSS_IOS_PROFILE)']
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    J2OBJC_HOME: $(SRCROOT)/vendor/j2objc-3.1/dist
    HEADER_SEARCH_PATHS: ['$(SRCROOT)/build/generated', '$(J2OBJC_HOME)/include']
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(J2OBJC_HOME)/lib/simulator
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(J2OBJC_HOME)/lib/iphone
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    OTHER_CFLAGS: ['$(inherited)', '-ffp-contract=off']
targets:
  BargeBoss:
    type: application
    platform: iOS
    sources:
      - path: BargeBoss
      - path: build/generated
        compilerFlags: '-fno-objc-arc'
      - path: ../assets
        type: folder
        buildPhase: resources
      - path: build/ThirdPartyNotices.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bargeboss.game.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: BargeBoss/Info.plist
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC', '-ljre_emul', '-liconv', '-lz']
    preBuildScripts:
      - name: Translate shared Java
        script: 'bash "$SRCROOT/scripts/translate.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: Security.framework
  BargeBossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bargeboss.game.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BargeBoss
schemes:
  BargeBoss:
    build:
      targets:
        BargeBoss: all
        BargeBossUITests: [test]
    test:
      targets: [BargeBossUITests]
