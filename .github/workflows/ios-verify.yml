name: Verify iOS compatibility
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'core/**/*Painter.java'
      - 'core/**/Viewport.java'
      - 'core/**/Layout.java'
      - 'core/**/StaticLayer.java'
      - 'core/**/SpriteAtlas.java'
      - 'core/**/VesselShoreLight.java'
      - '.github/workflows/ios-verify.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'core/**/*Painter.java'
      - 'core/**/Viewport.java'
      - 'core/**/Layout.java'
      - 'core/**/StaticLayer.java'
      - 'core/**/SpriteAtlas.java'
      - 'core/**/VesselShoreLight.java'
      - '.github/workflows/ios-verify.yml'
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run native gesture tests and unsigned device build as well
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    # Full gesture tutorial can take 28 minutes on slower hosted simulators;
    # leave time for both native builds and xcresult artifact uploads.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build tools
        run: brew install maven xcodegen
      - uses: actions/cache/restore@v4
        id: j2objc-cache
        with:
          path: |
            ios/vendor
            ~/.m2/repository
          key: j2objc-3.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/scripts/bootstrap.sh') }}
      - name: Bootstrap DDDumpling toolchain
        run: ./ios/scripts/bootstrap.sh
      - uses: actions/cache/save@v4
        if: steps.j2objc-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ios/vendor
            ~/.m2/repository
          key: ${{ steps.j2objc-cache.outputs.cache-primary-key }}
      - name: Compare JVM and native gameplay and drawing trace
        run: ./ios/scripts/parity.sh
      - name: Build iOS simulator app
        run: ./ios/scripts/build.sh
      - name: Exercise native touch, delivery, pause and background
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        run: ./ios/scripts/smoke.sh
      - name: Build unsigned iOS device app
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        run: ./ios/scripts/build.sh iphoneos
      - uses: actions/upload-artifact@v6
        with:
          name: bargeboss-ios-simulator
          path: ios/build/DerivedData/Build/Products/Debug-iphonesimulator/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-parity-evidence
          path: ios/build/parity/*.txt
      - uses: actions/upload-artifact@v6
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_validation
        with:
          name: ios-native-smoke
          path: |
            ios/build/Smoke-*.xcresult
            ios/build/native-title.png
