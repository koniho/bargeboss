name: Build and verify all platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Shared rules, replay and desktop build
        shell: bash
        run: |
          ./check.sh
          ./tools/check-profile.sh
          ./desktop.sh --build-only
      - name: Shared renderer captures
        if: runner.os == 'Linux'
        run: ./preview.sh
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ runner.os }}
          path: build/bargeboss.jar
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: shared-renderer-preview
          path: out/*.png
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build native APK with shared rules gate
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          ./build-android.sh
      - name: Compile optional developer profiling hooks
        run: |
          mkdir -p build/android/profile-check
          find developer/shared developer/android -name '*.java' | sort > build/android/profile-sources.txt
          echo tests/com/bargeboss/game/ReplayInput.java >> build/android/profile-sources.txt
          javac --release 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar:build/android/classes" -d build/android/profile-check @build/android/profile-sources.txt
      - uses: actions/upload-artifact@v6
        with:
          name: bargeboss-android-debug
          path: build/bargeboss-debug.apk
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build tools
        run: brew install maven xcodegen
      - uses: actions/cache/restore@v4
        id: j2objc-cache
        with:
          path: |
            ios/vendor
            ~/.m2/repository
          key: j2objc-3.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/scripts/bootstrap.sh') }}
      - name: Bootstrap DDDumpling toolchain
        run: ./ios/scripts/bootstrap.sh
      - uses: actions/cache/save@v4
        if: steps.j2objc-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ios/vendor
            ~/.m2/repository
          key: ${{ steps.j2objc-cache.outputs.cache-primary-key }}
      - name: Compare JVM and native gameplay and drawing trace
        run: ./ios/scripts/parity.sh
      - name: Build iOS simulator app
        run: ./ios/scripts/build.sh
      - name: Exercise native touch, delivery, pause and background
        run: ./ios/scripts/smoke.sh
      - name: Build unsigned iOS device app
        run: ./ios/scripts/build.sh iphoneos
      - uses: actions/upload-artifact@v6
        with:
          name: bargeboss-ios-simulator
          path: ios/build/DerivedData/Build/Products/Debug-iphonesimulator/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-parity-evidence
          path: ios/build/parity/*.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-native-smoke
          path: |
            ios/build/Smoke-*.xcresult
            ios/build/native-title.png
