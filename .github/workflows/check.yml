name: Build and verify Android and desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Shared rules, replay and desktop build
        shell: bash
        run: |
          ./check.sh
          ./tools/check-profile.sh
          ./desktop.sh --build-only
      - name: Shared renderer captures
        if: runner.os == 'Linux'
        run: ./preview.sh
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ runner.os }}
          path: build/bargeboss.jar
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: shared-renderer-preview
          path: out/*.png
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build native APK with shared rules gate
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          ./build-android.sh
      - name: Compile optional developer profiling hooks
        run: |
          mkdir -p build/android/profile-check
          find developer/shared developer/android -name '*.java' | sort > build/android/profile-sources.txt
          echo tests/com/bargeboss/game/ReplayInput.java >> build/android/profile-sources.txt
          javac --release 8 -cp "$ANDROID_HOME/platforms/android-36/android.jar:build/android/classes" -d build/android/profile-check @build/android/profile-sources.txt
      - uses: actions/upload-artifact@v6
        with:
          name: bargeboss-android-debug
          path: build/bargeboss-debug.apk
