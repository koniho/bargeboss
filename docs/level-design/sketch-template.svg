  <text x="40" y="696" font-size="16">Challenge / timing notes: _________________________________________________________</text>
  <text x="40" y="730" font-size="13" fill="#626d72">Planning template only — not a playable level file. Grid spacing is for sketching, not a fixed world scale.</text>
 </g>
