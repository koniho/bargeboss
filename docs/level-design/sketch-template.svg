<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
 <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c7cfd2" stroke-width="1"/></pattern></defs>
 <rect width="1000" height="760" fill="#f5f2e9"/>
 <g font-family="sans-serif" fill="#203640">
  <text x="40" y="48" font-size="28" font-weight="bold">BARGE BOSS — LEVEL SKETCH</text>
