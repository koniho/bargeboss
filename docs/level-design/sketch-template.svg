  <text x="40" y="114" font-size="17">Name: ________________________   Goal: ________________________</text>
  <rect x="40" y="140" width="640" height="520" fill="white" stroke="#203640" stroke-width="2"/>
  <rect x="40" y="140" width="640" height="520" fill="url(#grid)"/>
  <text x="720" y="166" font-size="20" font-weight="bold">Map legend</text>
  <rect x="720" y="190" width="28" height="24" fill="#3e8998"/><text x="762" y="208" font-size="16">Navigable water</text>
  <rect x="720" y="234" width="28" height="24" fill="#737e83"/><text x="762" y="252" font-size="16">Solid land / piers</text>
  <text x="720" y="296" font-size="19" font-weight="bold">T →</text><text x="778" y="296" font-size="16">Tug + heading</text>
  <text x="720" y="340" font-size="19" font-weight="bold">F1</text><text x="762" y="340" font-size="16">Feeder slot + arrow</text>
  <text x="720" y="384" font-size="19" font-weight="bold">A</text><text x="762" y="384" font-size="16">Berth + cargo type</text>
  <circle cx="734" cy="420" r="9" fill="none" stroke="#203640" stroke-width="3"/><text x="762" y="426" font-size="16">Bollard on shore</text>
  <path d="M720 464H749M720 458V470M749 458V470" stroke="#203640" stroke-width="3"/><text x="762" y="470" font-size="16">Bridge / waiting area</text>
  <rect x="720" y="500" width="28" height="24" fill="none" stroke="#8a7557" stroke-width="2" stroke-dasharray="5 3"/><text x="762" y="518" font-size="16">Scenery footprint</text>
  <text x="720" y="566" font-size="17" font-weight="bold">Check the route</text>
